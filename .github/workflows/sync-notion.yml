name: Sync Notion content

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
  push:
    branches: [main, master]
    paths:
      - notion.config.json
      - scripts/sync-notion.mjs
      - .github/workflows/sync-notion.yml

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Books, Writings, and Notes from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::NOTION_TOKEN is not set. Add a repository secret named NOTION_TOKEN at Settings → Secrets and variables → Actions."
            exit 1
          fi
          node scripts/sync-notion.mjs

      - name: Commit and push updated data files
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json data/writings.json data/notes.json data/notes/
          if git diff --staged --quiet; then
            echo "No changes to commit — data already up to date."
            exit 0
          fi
          git commit -m "Sync Books, Writings, and Notes from Notion"
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT is not set. Pushes from GITHUB_TOKEN update main but do not trigger GitHub Pages rebuilds. Add a classic PAT with repo scope as the GH_PAT repository secret."
            git push
          else
            git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
